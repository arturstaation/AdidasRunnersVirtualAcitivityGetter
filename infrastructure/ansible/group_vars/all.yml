# Vars não-sensíveis do stack Adidas (isolado). Segredos ficam em vault.yml (cifrado).
# O repo é clonado na VM; o build da imagem usa o Dockerfile/src da raiz do repo.

# infrastructure/host = onde estão o docker-compose.yml, o .env (renderizado) e os units.
adidas_stack_dir: "{{ playbook_dir }}/../host"

# Banco (não-secret). A senha vem do vault (vault_pg_password).
pg_user: "adidas"
pg_db: "adidas_runners"

# User-agent custom do scraping (opcional; vazio = usa o default do app).
agent: ""

# Proxy (selenium-wire é frágil em ARM — deixe false a menos que precise).
# Link/porta aqui (não-secret); usuário/senha vão no vault (vault_proxy_*).
proxy_enabled: "false"
proxy_link: ""
proxy_port: ""

# Agendamento do systemd timer — 00/06/12/18 no horário de Brasília
# (o fuso no OnCalendar é suportado pelo systemd da OL9; independe do TZ da VM, que é UTC).
schedule_oncalendar: "*-*-* 00,06,12,18:00:00 America/Sao_Paulo"

# -e run_now=true executa o bot uma vez ao fim do playbook (validação/cutover).
run_now: false
