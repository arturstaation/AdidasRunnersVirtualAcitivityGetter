name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11.3
      uses: actions/setup-python@v3
      with:
        python-version: "3.11.3"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Test with pytest
      env:
        PYTHONPATH: src/
      run: |
        pytest -q Testes --cov=src/ --cov-branch --cov-report=term-missing --cov-report=xml:src/coverage.xml
    - name: Upload coverage report (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          src/coverage.xml
    - name: Publish coverage summary
      run: |
        coverage=$(grep 'line-rate' src/coverage.xml | sed -E 's/.*line-rate="([^"]+)".*/\1/')
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "Line coverage: $coverage" >> $GITHUB_STEP_SUMMARY

  # Deploy ISOLADO na VM via SSH (secrets próprios do repo). O build arm64 acontece
  # NA VM (nativo, sem QEMU) → pipe rápida. Não usa k3s/Argo/registry/runner da Florae.
  # O .env (segredos) vive só na VM; o CI só envia o código e dispara o build+run.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Enviar código para a VM (sem segredos)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          source: "Dockerfile,requirements.txt,src/,infrastructure/host/"
          target: "~/adidas-runners"
          overwrite: true

      - name: Build + deploy + run na VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          command_timeout: 25m
          script: |
            chmod +x ~/adidas-runners/infrastructure/host/deploy.sh
            ~/adidas-runners/infrastructure/host/deploy.sh --run

  send_email:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Compose subject
        id: compose
        run: |
          OVERALL="success"
          if [ "${{ needs.build.result }}" != "success" ] || \
            [ "${{ needs.deploy.result }}" != "success" ]; then
            OVERALL="failure"
          fi
          echo "subject=CI/CD - adidas-runners: ${OVERALL} (run #${{ github.run_number }})" >> $GITHUB_OUTPUT

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.EMAIL_FROM }}
          to: ${{ secrets.EMAIL_TO }}
          secure: true
          subject: ${{ steps.compose.outputs.subject }}
          body: |
            Repositório: ${{ github.repository }}
            Workflow: ${{ github.workflow }}

            Status por job:
            - build:  ${{ needs.build.result }}
            - deploy: ${{ needs.deploy.result }}

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
