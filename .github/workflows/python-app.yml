name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11.3
      uses: actions/setup-python@v3
      with:
        python-version: "3.11.3"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Test with pytest
      env:
        PYTHONPATH: src/
      run: |
        pytest -q Testes --cov=src/ --cov-branch --cov-report=term-missing --cov-report=xml:src/coverage.xml
    - name: Upload coverage report (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          src/coverage.xml
    - name: Publish coverage summary
      run: |
        coverage=$(grep 'line-rate' src/coverage.xml | sed -E 's/.*line-rate="([^"]+)".*/\1/')
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "Line coverage: $coverage" >> $GITHUB_STEP_SUMMARY

  deploy_aws:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image tag
        id: vars
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build & Push ECR
        id: build_push
        run: |
          ECR_REGISTRY=${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY=adidasrunners
          IMAGE_TAG=${{ steps.vars.outputs.IMAGE_TAG }}
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build . -t "$IMAGE_URI"
          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Calcular próximo horário fixo (00:00, 06:00, 12:00, 18:00 UTC)
        id: schedule_time
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TODAY=$(date -u +"%Y-%m-%d")
          TIMES=("00:00" "06:00" "12:00" "18:00")
          NOW_TS=$(date -u -d "$NOW" +%s)

          NEXT_TIME=""
          for t in "${TIMES[@]}"; do
            CANDIDATE="${TODAY}T${t}:00Z"
            CANDIDATE_TS=$(date -u -d "$CANDIDATE" +%s)
            if [ "$CANDIDATE_TS" -ge "$NOW_TS" ]; then
              NEXT_TIME="$CANDIDATE"
              break
            fi
          done

          if [ -z "$NEXT_TIME" ]; then
            TOMORROW=$(date -u -d "+1 day" +"%Y-%m-%d")
            NEXT_TIME="${TOMORROW}T00:00:00Z"
          fi

          echo "Próximo horário agendado: $NEXT_TIME"
          echo "start=$NEXT_TIME" >> $GITHUB_OUTPUT

      - name: Deploy CloudFormation stack
        env:
          IMAGE_URI: ${{ steps.build_push.outputs.IMAGE_URI }}
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name adidasrunners-stack \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ImageUri="$IMAGE_URI" \
              LambdaName="adidasrunnersbot" \
              StateMachineName="AdidasRunnersStateMachine" \
              EventRuleName="AdidasRunnersSchedule" \
              EventScheduleExpression="rate(6 hours)" \
              ScheduleStart="${{ steps.schedule_time.outputs.start }}" \
              MemorySize=1024 \
              EphemeralStorageSize=512 \
              Timeout=900 \
              SnapStart="None" \
              AdminChatId="${{ secrets.ADMIN_CHAT_ID }}" \
              ChatId="${{ secrets.CHAT_ID }}" \
              GOOGLE_CREDENTIALS="${{ secrets.GOOGLE_CREDENTIALS }}" \
              GOOGLE_SHEET_ID="${{ secrets.GOOGLE_SHEET_ID }}" \
              PROXY_ENABLED="${{ secrets.PROXY_ENABLED }}" \
              PROXY_PASSWORD="${{ secrets.PROXY_PASSWORD }}" \
              PROXY_USER="${{ secrets.PROXY_USER }}" \
              TOKEN="${{ secrets.TOKEN }}" \
              AGENT="${{ secrets.AGENT }}"

  send_email:
    runs-on: ubuntu-latest
    needs: [build, deploy_aws]
    if: always()
    steps:
      - name: Compose subject
        id: compose
        run: |
          OVERALL="success"
          if [ "${{ needs.build.result }}" != "success" ] || \
            [ "${{ needs.deploy_aws.result }}" != "success" ]; then
            OVERALL="failure"
          fi
          echo "subject=CI/CD - adidasrunnersbot: ${OVERALL} (run #${{ github.run_number }})" >> $GITHUB_OUTPUT

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.EMAIL_FROM }}
          to: ${{ secrets.EMAIL_TO }}
          secure: true
          subject: ${{ steps.compose.outputs.subject }}
          body: |
            Repositório: ${{ github.repository }}
            Workflow: ${{ github.workflow }}

            Status por job:
            - build: ${{ needs.build.result }}
            - deploy_aws: ${{ needs.deploy_aws.result }}

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}